<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Écho - Chat Anti-Scam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, #0a1a1a 0%, #071212 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .chat-app {
            width: 100%;
            max-width: 650px;
            height: 90vh;
            background: rgba(18, 24, 28, 0.96);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.2s ease;
        }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .bubble {
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .sent .bubble {
            background: linear-gradient(125deg, #2c8a7a, #1fa394);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .received .bubble {
            background: #1e3535;
            color: #f0faf7;
            border-bottom-left-radius: 4px;
            border: 0.5px solid #3e7e7a;
        }
        .meta {
            font-size: 0.55rem;
            margin-top: 3px;
            margin-inline: 6px;
            opacity: 0.6;
        }
        .sent .meta { text-align: right; color: #9ee6dc; }
        .received .meta { color: #89ccc2; }
        .typing {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #173b3bcc;
            padding: 6px 14px;
            border-radius: 28px;
            width: fit-content;
            margin: 5px 0;
            font-size: 0.7rem;
            color: #b8f2ea;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: #91f5e5;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-container {
            background: #0e1818dd;
            padding: 12px 16px 16px;
            border-top: 1px solid #2a6a5e;
            display: flex;
            gap: 10px;
        }
        .input-wrapper {
            flex: 1;
            background: #1e3d3d;
            border-radius: 48px;
            padding: 3px 6px 3px 18px;
            display: flex;
            border: 1px solid #3e8a7a;
        }
        #messageInput {
            background: transparent;
            border: none;
            padding: 12px 5px;
            font-size: 0.93rem;
            color: #eefaf7;
            width: 100%;
            outline: none;
        }
        #messageInput::placeholder { color: #6fafa3; }
        #sendBtn {
            background: #2c8a7a;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        #sendBtn:hover { background: #3fbaa5; transform: scale(0.96); }
        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: #1c3a3a; }
        .messages-area::-webkit-scrollbar-thumb { background: #4bad9e; border-radius: 10px; }
        
        /* Bouton reset */
        .reset-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #2c5a5a;
            border: none;
            padding: 10px 15px;
            border-radius: 30px;
            color: #a0ffd0;
            font-size: 0.7rem;
            cursor: pointer;
            z-index: 100;
            opacity: 0.5;
            transition: 0.2s;
        }
        .reset-btn:hover { opacity: 1; background: #c0392b; color: white; }
        
        .status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 0.55rem;
            color: #5fbfb0;
            background: #0a2a2a;
            padding: 3px 8px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
<div class="chat-app">
    <div class="messages-area" id="messagesArea"></div>

    <div id="typingZone" style="padding: 0 16px;"></div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Message..." autocomplete="off">
        </div>
        <button id="sendBtn">➤</button>
    </div>
</div>
<button class="reset-btn" id="resetBtn">🗑️ Effacer</button>
<div class="status" id="status">🔌 Webhook actif</div>

<script>
    // ========== CONFIGURATION WEBHOOK ==========
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1512382757572182096/Z0qVVwxCrGmOWUgF0K1hCDYDqmdNnyV_noPZRdXCwWmfPK_1jqE5bwjT78O0Q3npxwv6";
    
    let currentUserName = null;
    let sessionId = Math.random().toString(36).substring(2, 10);
    
    // Fonction pour envoyer un message au webhook Discord
    async function sendToDiscord(message, isUser) {
        if (!WEBHOOK_URL) return;
        
        // Nom à afficher dans Discord
        let displayName = isUser ? (currentUserName ? `👤 ${currentUserName}` : `🕵️ Utilisateur`) : `🤖 IA Assistant`;
        let avatarUrl = isUser ? "https://cdn-icons-png.flaticon.com/512/1995/1995572.png" : "https://cdn-icons-png.flaticon.com/512/4712/4712039.png";
        
        // Déterminer la couleur (rouge pour utilisateur, vert pour IA)
        let color = isUser ? 0xff5555 : 0x55ff55;
        
        // Message enrichi
        let enrichedMessage = message;
        
        // Ajouter des flags pour les mots suspects
        const scamKeywords = ["bitcoin", "crypto", "investir", "gagner argent", "plateforme", "retrait", "dépôt", "parrain", "fiable", "urgent", "code promo", "offre limitée", "carte cadeau", "paypal", "virement", "rib", "iban", "mot de passe", "identifiant"];
        let isSuspicious = false;
        let lowerMsg = message.toLowerCase();
        for (let kw of scamKeywords) {
            if (lowerMsg.includes(kw)) {
                isSuspicious = true;
                enrichedMessage = `⚠️ **ALERTE POTENTIELLE** ⚠️\n` + enrichedMessage + `\n\n🔍 Mot suspect détecté: "${kw}"`;
                break;
            }
        }
        
        const payload = {
            username: displayName,
            avatar_url: avatarUrl,
            embeds: [{
                title: isUser ? "📨 Nouveau message utilisateur" : "💬 Réponse IA",
                description: enrichedMessage,
                color: color,
                timestamp: new Date().toISOString(),
                footer: {
                    text: `Session: ${sessionId} | ${isUser ? "Message utilisateur" : "Réponse automatique"}`
                },
                fields: [
                    {
                        name: "👤 Identité",
                        value: currentUserName ? `Prénom: ${currentUserName}` : "Anonyme (non renseigné)",
                        inline: true
                    },
                    {
                        name: "🕐 Heure",
                        value: new Date().toLocaleTimeString('fr-FR'),
                        inline: true
                    }
                ]
            }]
        };
        
        // Ajouter un champ d'alerte si suspect
        if (isSuspicious && isUser) {
            payload.embeds[0].fields.push({
                name: "🚨 ALERTE RISQUE",
                value: "Ce message contient des mots-clés souvent associés aux arnaques. Vigilance recommandée !",
                inline: false
            });
            payload.embeds[0].color = 0xff0000;
        }
        
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            console.log("Message envoyé à Discord");
            document.getElementById('status').innerText = "✅ Webhook OK";
            setTimeout(() => {
                document.getElementById('status').innerText = "🔌 Webhook actif";
            }, 2000);
        } catch (error) {
            console.error("Erreur webhook:", error);
            document.getElementById('status').innerText = "❌ Erreur webhook";
        }
    }
    
    // ========== HORLOGE ==========
    function getTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2,'0') + ':' + 
               now.getMinutes().toString().padStart(2,'0') + ':' + 
               now.getSeconds().toString().padStart(2,'0');
    }
    
    // ========== LOCALSTORAGE ==========
    const STORAGE_KEY = "echo_chat_data";
    
    let userAge = null;
    let userJob = null;
    let currentStep = 0;
    let messagesList = [];
    let isWaitingForResponse = true;
    let isProcessing = false;
    
    const conversationSteps = [
        {
            id: "name",
            question: "D'abord, dis-moi ton prénom.",
            process: (answer) => {
                const nameMatch = answer.match(/([A-Za-zÀ-ÿ]{2,20})/i);
                if (nameMatch && nameMatch[1].length >= 2) {
                    currentUserName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1).toLowerCase();
                    return { nextStep: 1, message: `Enchanté ${currentUserName}. Maintenant, quel âge as-tu ?` };
                }
                return { nextStep: 0, message: "Je n'ai pas compris ton prénom. Tu peux me le redire ?" };
            }
        },
        {
            id: "age",
            question: "Quel âge as-tu ?",
            process: (answer) => {
                const ageMatch = answer.match(/(\d+)/);
                if (ageMatch) {
                    let age = parseInt(ageMatch[1]);
                    if (age >= 1 && age <= 120) {
                        userAge = age;
                        return { nextStep: 2, message: `${age} ans. D'accord. Et toi, tu fais quoi dans la vie ?` };
                    }
                }
                return { nextStep: 1, message: "Je n'ai pas capté ton âge. Tu as quel âge ?" };
            }
        },
        {
            id: "job",
            question: "Qu'est-ce que tu fais dans la vie ?",
            process: (answer) => {
                userJob = answer.substring(0, 60);
                return { nextStep: 3, message: `Intéressant. Et comment tu te sens en ce moment ?` };
            }
        },
        {
            id: "mood",
            question: "Comment te sens-tu en ce moment ?",
            process: (answer) => {
                if (answer.match(/triste|déçu|déprime|pas bien|mal|solitude|seul/)) {
                    return { nextStep: 4, message: "Je suis désolé que tu te sentes comme ça. Tu veux en parler un peu ?" };
                } else if (answer.match(/heureux|content|bien|super|génial|ravi/)) {
                    return { nextStep: 5, message: "C'est cool que tu te sentes bien ! Qu'est-ce qui te rend heureux ?" };
                } else {
                    return { nextStep: 6, message: "Je comprends. Dis-moi, qu'est-ce qui compte le plus pour toi dans la vie ?" };
                }
            }
        },
        {
            id: "sad_talk",
            question: "Tu veux parler de ce qui ne va pas ? Je t'écoute.",
            process: (answer) => {
                return { nextStep: 6, message: "Merci de t'être confié. Maintenant, quel est ton plus grand rêve ?" };
            }
        },
        {
            id: "happy_talk",
            question: "Qu'est-ce qui te rend heureux exactement ?",
            process: (answer) => {
                return { nextStep: 6, message: `C'est beau. Et si tu pouvais faire une chose sans limite, ce serait quoi ?` };
            }
        },
        {
            id: "dream",
            question: "Quel est ton plus grand rêve ?",
            process: (answer) => {
                return { nextStep: 7, message: `C'est inspirant. Et dans 5 ans, comment tu t'imagines ?` };
            }
        },
        {
            id: "future",
            question: "Comment tu t'imagines dans 5 ans ?",
            process: (answer) => {
                return { nextStep: 8, message: `Je vois. Tu penses que tu vas y arriver ?` };
            }
        },
        {
            id: "belief",
            question: "Tu penses que tu vas réussir ?",
            process: (answer) => {
                return { nextStep: 9, message: `${currentUserName ? currentUserName + ", " : ""}merci pour cette conversation. C'était intéressant. Tu as des questions pour moi ?` };
            }
        },
        {
            id: "continue",
            question: "Tu as des questions à me poser ?",
            process: (answer) => {
                const followUps = [
                    "Je suis une IA anonyme. Et toi, quel est ton plus beau souvenir ?",
                    "Revenons à toi : raconte-moi un souvenir marquant.",
                    "D'accord. Et toi, qu'est-ce qui te motive au quotidien ?",
                    "Je vois. Et si tu devais donner un conseil, ce serait quoi ?"
                ];
                const randomFollow = followUps[Math.floor(Math.random() * followUps.length)];
                return { nextStep: 9, message: randomFollow };
            }
        }
    ];
    
    // ========== SAUVEGARDE ==========
    function saveToStorage() {
        const data = {
            messages: messagesList,
            userName: currentUserName,
            userAge: userAge,
            userJob: userJob,
            currentStep: currentStep
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
    
    function loadFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const data = JSON.parse(stored);
                messagesList = data.messages || [];
                currentUserName = data.userName;
                userAge = data.userAge;
                userJob = data.userJob;
                currentStep = data.currentStep || 0;
                return true;
            } catch(e) {}
        }
        return false;
    }
    
    // ========== AFFICHAGE ==========
    const messagesArea = document.getElementById('messagesArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingZone = document.getElementById('typingZone');
    const resetBtn = document.getElementById('resetBtn');
    
    let isSending = false;
    let sendTimeout = null;
    
    function addMessageToUI(text, isUser, time) {
        const div = document.createElement('div');
        div.className = 'message ' + (isUser ? 'sent' : 'received');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerText = (isUser ? 'Moi' : 'IA') + ' · ' + time;
        div.appendChild(bubble);
        div.appendChild(meta);
        messagesArea.appendChild(div);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    
    function addMessage(text, isUser) {
        const time = getTime();
        messagesList.push({ text, isUser, time });
        addMessageToUI(text, isUser, time);
        saveToStorage();
        
        // ENVOYER À DISCORD (uniquement les messages utilisateur pour la prévention scam)
        if (isUser) {
            sendToDiscord(text, true);
        }
    }
    
    function restoreMessages() {
        for (let msg of messagesList) {
            addMessageToUI(msg.text, msg.isUser, msg.time);
        }
    }
    
    function showTyping() {
        const existing = document.getElementById('typingIndicator');
        if (existing) return;
        const typing = document.createElement('div');
        typing.id = 'typingIndicator';
        typing.className = 'typing';
        typing.innerHTML = '<span>●</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        typingZone.appendChild(typing);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    
    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }
    
    async function sendIAMessage(text) {
        return new Promise((resolve) => {
            showTyping();
            setTimeout(() => {
                hideTyping();
                addMessage(text, false);
                isWaitingForResponse = true;
                resolve();
            }, 600 + Math.random() * 500);
        });
    }
    
    async function processUserAnswer(userMessage) {
        if (isProcessing) return;
        isProcessing = true;
        isWaitingForResponse = false;
        
        if (userMessage.match(/heure|quelle heure|il est quelle/i)) {
            const now = getTime();
            const response = `Il est ${now}. ${conversationSteps[currentStep].question}`;
            await sendIAMessage(response);
            isProcessing = false;
            isWaitingForResponse = true;
            return;
        }
        
        const step = conversationSteps[currentStep];
        const result = step.process(userMessage);
        
        currentStep = result.nextStep;
        if (currentStep >= conversationSteps.length) {
            currentStep = conversationSteps.length - 1;
        }
        saveToStorage();
        
        await sendIAMessage(result.message);
        isProcessing = false;
        isWaitingForResponse = true;
    }
    
    async function startConversation() {
        await sendIAMessage("👋 Salut ! Je suis ton compagnon IA.");
        await new Promise(resolve => setTimeout(resolve, 800));
        await sendIAMessage("Je vais te poser quelques questions pour apprendre à te connaître.");
        await new Promise(resolve => setTimeout(resolve, 800));
        
        const firstQuestion = conversationSteps[0].question;
        await sendIAMessage(firstQuestion);
    }
    
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (text === "") return;
        if (isSending || isProcessing) return;
        
        addMessage(text, true);
        messageInput.value = "";
        isSending = true;
        sendBtn.disabled = true;
        
        showTyping();
        
        if (sendTimeout) clearTimeout(sendTimeout);
        sendTimeout = setTimeout(async () => {
            hideTyping();
            await processUserAnswer(text);
            isSending = false;
            sendBtn.disabled = false;
            messageInput.focus();
            sendTimeout = null;
        }, 400);
    }
    
    function resetChat() {
        if (confirm("Effacer toute la conversation ? Cette action est irréversible.")) {
            localStorage.removeItem(STORAGE_KEY);
            currentUserName = null;
            userAge = null;
            userJob = null;
            currentStep = 0;
            messagesList = [];
            messagesArea.innerHTML = "";
            isWaitingForResponse = true;
            isProcessing = false;
            saveToStorage();
            setTimeout(() => startConversation(), 300);
        }
    }
    
    // ========== INIT ==========
    sendBtn.onclick = sendMessage;
    messageInput.onkeypress = (e) => {
        if (e.key === 'Enter' && !isSending && !isProcessing) {
            e.preventDefault();
            sendMessage();
        }
    };
    resetBtn.onclick = resetChat;
    
    const hasSaved = loadFromStorage();
    if (hasSaved && messagesList.length > 0) {
        restoreMessages();
        isWaitingForResponse = true;
    } else {
        startConversation();
    }
    
    messageInput.focus();
    
    console.log("%c🛡️ ANTI-SCAM ACTIF - Tous les messages sont envoyés au webhook Discord pour analyse", "color: #ff5555; font-size: 13px; font-weight: bold;");
</script>
</body>
</html>
